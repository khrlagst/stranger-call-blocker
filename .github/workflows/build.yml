name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['badges/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      CI_KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      CI_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Quality Gate (pre-flight checks)
        run: |
          chmod +x .githooks/pre-commit
          bash .githooks/pre-commit

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android licenses & install platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version=8.11.1

      - name: Restore keystore (mandatory secret)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE secret is required — signing keys must be stable across releases."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > ci.keystore

      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: stranger-blocker-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: stranger-blocker-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing release for this tag to allow re-runs
          gh release delete "${GITHUB_REF_NAME}" --yes 2>/dev/null || true
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            # Preview tags (e.g. v1.9.5-p01) → mark as pre-release
            gh release create "${GITHUB_REF_NAME}" \
              app/build/outputs/apk/release/*.apk \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --prerelease
          else
            gh release create "${GITHUB_REF_NAME}" \
              app/build/outputs/apk/release/*.apk \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

      # Publish the APK-size badge (main pushes only; the badges/** path is
      # ignored by the workflow trigger, so this commit cannot re-trigger CI).
      - name: Publish APK size badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p badges
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            SIZE_MB=$(awk "BEGIN{printf \"%.1f\", $(stat -c%s app/build/outputs/apk/release/app-release.apk)/1048576}")
            printf '{"schemaVersion":1,"label":"apk size","message":"%s MB","color":"10B981"}\n' "$SIZE_MB" > badges/apk-size.json
            git add badges/apk-size.json
            git diff --cached --quiet || { git commit -m "chore(badges): update apk size" && git push origin HEAD:main; }
          fi
